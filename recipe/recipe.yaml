schema_version: 1

context:
  version: "1.0.1"
  python_min: "3.10"

package:
  name: particle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/particle/particle-${{ version }}.tar.gz
  sha256: 3f2ec4dbb8953c90ba83b891d6534cd82dc1aece4111b79998ff284ce377a922

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - attrs >=22.2.0
    - hepunits >=2.4.0

tests:
  - python:
      imports:
        - particle
        - particle.converters
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Extended PDG particle data and MC identification codes
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-hep/particle
  repository: https://github.com/scikit-hep/particle

extra:
  recipe-maintainers:
    - eduardo-rodrigues
    - chrisburr
    - henryiii
    - conda-forge/scikit-hep
